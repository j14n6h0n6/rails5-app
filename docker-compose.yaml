services:
  db:
    image: postgres:10.5
    container_name: rails5_db
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db-volume:/var/lib/postgresql/data

  web:
    image: rails5-app-web:5.2.8
    build:
      context: .
      tags:
        - "rails5-app-web:5.2.8"
    container_name: rails5_web
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - .:/app
      - bundle-data:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  db-volume:
  bundle-data: